name: Feature request
description: Propose a receive-only WaveRider improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Field problem
      description: What foxhunting or device-management problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware implications
      description: Note any GPIO, power, USB, storage, audio, radio, or firmware impact.
  - type: checkboxes
    id: boundary
    attributes:
      label: Project boundary
      options:
        - label: This feature is receive-only.
          required: true
