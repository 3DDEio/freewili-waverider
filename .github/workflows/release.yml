name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install '.[installer,dev]'
      - name: Verify release tag and source branch
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version"-alpha*|"v$version"-beta*|"v$version"-rc*) ;;
            *)
              echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
              exit 1
              ;;
          esac
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release commit $GITHUB_SHA is not contained in origin/main" >&2
            exit 1
          }
      - run: python -m pytest -q tests
      - run: python wilibsp/tools/check_app_repo.py .
      - run: python tools/prepare_wilibsp.py
      - run: sha256sum -c native/dist/SHA256SUMS
      - run: cd vendor/debian-source/rtl-sdr-2.0.2-2 && sha256sum -c SHA256SUMS
      - run: |
          printf '%s  %s\n' \
            4edd72c4f9a250a237a1d6d56a3120638d147560fd9e3d7e78a693b010bbb7f9 \
            vendor/debian-arm64/librtlsdr0_2.0.2-2+b1_arm64.deb | sha256sum -c -
          printf '%s  %s\n' \
            d139e07182836a94244285f441ba8355ff7e953a58f03090837d203426d48e3e \
            vendor/debian-arm64/rtl-sdr_2.0.2-2+b1_arm64.deb | sha256sum -c -
      - run: python wilibsp/tools/check_app_uf2.py native/dist/waverider_display.uf2
      - run: python wilibsp/tools/check_app_uf2.py native/dist/waverider_installer.uf2
      - run: sh deploy/setup-native-ci-linux.sh
      - name: Rebuild and compare release UF2 files
        run: |
          mkdir -p build/committed-native
          cp native/dist/waverider_display.uf2 build/committed-native/
          cp native/dist/waverider_installer.uf2 build/committed-native/
          BUILD_DIR="$GITHUB_WORKSPACE/build/release-native" sh deploy/build-native-apps.sh
          cmp build/committed-native/waverider_display.uf2 native/dist/waverider_display.uf2
          cmp build/committed-native/waverider_installer.uf2 native/dist/waverider_installer.uf2
      - run: sha256sum -c native/dist/SHA256SUMS
      - run: sh deploy/build-release.sh
      - run: cd dist && sha256sum -c freewili-foxhunt-*.tar.gz.sha256
      - run: sh deploy/build-source-release.sh
      - run: cd dist && sha256sum -c freewili-waverider-source-*.tar.gz.sha256
      - name: Sign release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            native/dist/waverider_display.uf2
            native/dist/waverider_installer.uf2
            native/dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.sha256 \
            native/dist/waverider_display.uf2 \
            native/dist/waverider_installer.uf2 \
            native/dist/SHA256SUMS \
            --generate-notes $prerelease
