name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[installer,dev]'
      - run: python -m pytest -q tests
      - run: python wilibsp/tools/check_app_repo.py .
      - run: python tools/prepare_wilibsp.py
      - run: sh -n install.sh uninstall.sh bin/foxhuntctl bin/foxhunt-guard deploy/build-native-apps.sh deploy/build-release.sh deploy/build-source-release.sh deploy/setup-native-ci-linux.sh
      - run: cd vendor/debian-source/rtl-sdr-2.0.2-2 && sha256sum -c SHA256SUMS
      - run: |
          printf '%s  %s\n' \
            4edd72c4f9a250a237a1d6d56a3120638d147560fd9e3d7e78a693b010bbb7f9 \
            vendor/debian-arm64/librtlsdr0_2.0.2-2+b1_arm64.deb | sha256sum -c -
          printf '%s  %s\n' \
            d139e07182836a94244285f441ba8355ff7e953a58f03090837d203426d48e3e \
            vendor/debian-arm64/rtl-sdr_2.0.2-2+b1_arm64.deb | sha256sum -c -
      - run: sh deploy/build-source-release.sh
      - run: cd dist && sha256sum -c freewili-waverider-source-*.tar.gz.sha256

  native-release:
    name: native-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: sh deploy/setup-native-ci-linux.sh
      - name: Build native release products twice
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/build/ci-native-1" sh deploy/build-native-apps.sh
          mkdir -p build/native-reference
          cp native/dist/*.elf native/dist/*.uf2 native/dist/SHA256SUMS build/native-reference/
          BUILD_DIR="$GITHUB_WORKSPACE/build/ci-native-2" sh deploy/build-native-apps.sh
          for artifact in WaveRider.uf2 waverider_display.elf waverider_installer.elf waverider_installer.uf2 SHA256SUMS; do
            cmp "build/native-reference/$artifact" "native/dist/$artifact"
          done
      - run: sha256sum -c native/dist/SHA256SUMS
      - run: python wilibsp/tools/check_app_uf2.py native/dist/WaveRider.uf2
      - run: python wilibsp/tools/check_app_uf2.py native/dist/waverider_installer.uf2
      - run: sh deploy/build-release.sh
      - run: cd dist && sha256sum -c freewili-foxhunt-*.tar.gz.sha256
      - name: Retain native comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-reproducibility-evidence
          path: |
            build/native-reference/*
            native/dist/*.elf
            native/dist/*.uf2
            native/dist/SHA256SUMS
            dist/freewili-foxhunt-*.tar.gz
            dist/freewili-foxhunt-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
